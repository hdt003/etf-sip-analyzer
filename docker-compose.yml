version: '3.8'

services:
  web:
    build: .
    container_name: etf_sip_analyzer_web
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/etf_sip_db
      - SECRET_KEY=super-secret-jwt-key-change-this-in-production
      - ENVIRONMENT=production
      - DEBUG=False
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16-alpine
    container_name: etf_sip_analyzer_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=etf_sip_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
